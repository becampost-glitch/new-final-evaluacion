name: CI/CD & DevSecOps EduTech Labs

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  test-and-quality:
    name: Pruebas, SonarCloud y Snyk
    runs-on: ubuntu-latest
    steps:
      - name: Descargar cÃ³digo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias con cobertura
        run: npm test

      - name: AnÃ¡lisis de calidad con SonarCloud
        uses: SonarSource/sonarqube-scan-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Escaneo de vulnerabilidades con Snyk
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  docker-build-and-scan:
    name: Build, Docker Scout y Push a Docker Hub
    needs: test-and-quality
    runs-on: ubuntu-latest
    steps:
      - name: Descargar cÃ³digo
        uses: actions/checkout@v4

      - name: Construir imagen Docker local
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/edutech-labs:latest .

      - name: Iniciar sesiÃ³n en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Escaneo de seguridad con Docker Scout
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ secrets.DOCKER_USERNAME }}/edutech-labs:latest
          only-severities: critical,high

      - name: Publicar imagen en Docker Hub
        if: github.event_name == 'push'
        run: docker push ${{ secrets.DOCKER_USERNAME }}/edutech-labs:latest